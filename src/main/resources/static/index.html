<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body style="font-family:sans-serif;max-width:520px;margin:2rem auto;padding:0 1rem">
  <h2>Order Tracker</h2>
  <input id="p" value="A1"> <input id="q" type="number" value="1" style="width:60px">
  <button onclick="order()">Place order</button>
  <pre id="log"></pre>
<script>
const log = m => document.getElementById('log').textContent += m + '\n';
const client = Stomp.over(new SockJS('/ws-order'));
client.debug = null;
client.connect({}, () => log('WebSocket connected'));

async function order() {
  const r = await fetch('/api/orders', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'Idempotency-Key': crypto.randomUUID()},
    body: JSON.stringify({productId: document.getElementById('p').value, quantity: +document.getElementById('q').value})
  });
  const t = await r.text();
  log(r.status + ': ' + t);
  const m = t.match(/(\d+)$/);
  if (r.status === 202 && m) client.subscribe('/topic/orders/' + m[1], f => log('LIVE: ' + f.body));
}
</script>
</body>
</html>
